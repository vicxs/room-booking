# Local development dependencies. The backend starts this file automatically
# through spring-boot-docker-compose when run with `./mvnw spring-boot:run`.
#
# The project name is fixed so every checkout, agent worktrees included, shares
# this one PostgreSQL. Otherwise Compose names the project after the directory
# and a worktree starts a second container that cannot bind port 5432.
name: room-booking
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: roombooking
      POSTGRES_USER: roombooking
      POSTGRES_PASSWORD: roombooking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roombooking -d roombooking"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
