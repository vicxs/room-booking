spring:
  application:
    name: room-booking
  datasource:
    url: jdbc:postgresql://localhost:5432/roombooking
    username: roombooking
    password: roombooking
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  jooq:
    sql-dialect: postgres
  mvc:
    servlet:
      path: /api
  threads:
    virtual:
      enabled: true
logging:
  level:
    # jOOQ's start-up banner and "tip of the day".
    org.jooq.Constants: warn
