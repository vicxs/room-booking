name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every commit a PR adds must be authored by the factory bot (docs/factory.md,
  # "Agent identity"). The job also runs the tests of the factory's shell
  # scripts: the commit-author check and scripts/factory-metrics (docs/factory.md,
  # "Metrics"). Skipped outside PRs; a skipped job counts as passing.
  identity:
    name: identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the check
        run: scripts/tests/check-commit-authors.test.sh
      # The other factory scripts are checked here too: this is the job that
      # owns scripts/, and the ruleset's required checks are a fixed list.
      - name: ShellCheck the factory scripts
        run: git ls-files -z scripts | xargs -0 shellcheck
      - name: Test the SessionStart hook
        run: scripts/tests/sync-main.test.sh
      - name: Test the factory metrics
        run: scripts/tests/factory-metrics.test.sh
      # The checkout is the PR's merge commit (refs/pull/N/merge): its first
      # parent is the current base branch and its second the PR head, so
      # HEAD^1..HEAD^2 is exactly the PR's commits. The event payload's
      # base.sha is not used: it can be stale after the base branch moves.
      - name: Check commit authors
        run: scripts/check-commit-authors HEAD^1 HEAD^2

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          maven-cache: "false"
      - name: Contract client generation is quiet on success
        run: scripts/check-generate-api-quiet
      - name: Lint and format
        run: pnpm -C frontend lint
      - name: Typecheck (includes the generated Contract client)
        run: pnpm -C frontend typecheck
      - name: Unit tests
        run: pnpm -C frontend test
      - name: Build
        run: pnpm -C frontend build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Install Playwright browser
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm -C frontend e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
