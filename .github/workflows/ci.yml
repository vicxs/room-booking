name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          maven-cache: "false"
      - name: Lint and format
        run: pnpm -C frontend lint
      - name: Typecheck (includes the generated Contract client)
        run: pnpm -C frontend typecheck
      - name: Unit tests
        run: pnpm -C frontend test
      - name: Build
        run: pnpm -C frontend build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Install Playwright browser
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm -C frontend e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
